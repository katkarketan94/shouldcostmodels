anel thickness x density, plus scrap. Insulation weight = surface x thickness x density."},B17:{v:"4.  Coil copper and aluminium follow from tube pitch, rows, FPI and coil depth, converted to weight via tube OD/wall thickness and fin thickness."},B18:{v:"5.  Fan power = airflow x total static (ESP + internal + per-row + per-filter-stage) / (fan efficiency x motor efficiency), then the next standard motor size up is selected."},B20:{v:"WHERE THE MODEL LANDS AGAINST BENCHMARK"},B21:{v:"The seeded cases run Rs 23.5 to 84.7 per CFM. Five of six sit in a Rs 43-58/CFM band \u2014 squarely against Anuj's benchmark of Rs 40-50/CFM. The cleanroom case (SS 304, HEPA, 8 rows) is a genuinely heavier spec and prices higher; the stripped single-skin GI basement unit prices lower. Both are correct outcomes, not errors."},B23:{v:"PRICES AND RATES \u2014 READ BEFORE QUOTING"},B24:{v:"Copper tube at Rs 880/kg and aluminium fin at Rs 260/kg reflect current market listings. Every bought-out rate \u2014 fan, VFD, filters, dampers, blower \u2014 and the PUF/rockwool rates are indicative placeholders, not vendor quotes. Confirming these against 2-3 actual vendor quotes is the highest-value next step, since bought-outs are close to half of total cost on most rows."},B26:{v:"MODELLING CHOICES WORTH KNOWING"},B27:{v:"\u2022  Coil face area is sized on face velocity, not a thermal calculation. Cooling duty (TR) is reported for cost-per-TR but does not independently size rows or FPI \u2014 an inconsistent duty/geometry combination will not be flagged."},B28:{v:"\u2022  Casing width and height come from a single aspect ratio, not a manufacturer's standard module sizes."},B29:{v:"\u2022  The FCU blower uses a two-part rate (fixed + per watt) so larger ducted units aren't over-priced by a flat Rs/W."},B30:{v:"\u2022  Ductwork, piping, controls, BMS integration, freight and site work are outside the boundary \u2014 this is a factory-gate equipment cost."},B32:{v:"Yellow = your input.   Green = res
