1A3 for star."},B15:{v:"\u2022 Accessories, tap changer, fittings, tests and labour % are priced by voltage class (Assumptions & Ref R.1), so a 400 kV station transformer carries 400 kV bushings and OLTC regardless of MVA."},B16:{v:"\u2022 v9 bug fixed: IEEMA!C62:I62 referenced an external workbook ([1]IEEMA); weights are now internal."},B18:{v:"CALIBRATION METHOD"},B19:{v:"Engineering first: weights from geometry, priced at Section B rates, plus voltage-class accessories and conversion. Then one factor = reference price \xF7 engineering cost, applied to the total. The factor is a diagnostic, not a discount: it shows how far unverified rates, OEM premium and the reference price's own basis sit from the physics."},B20:{v:"Calibration reference: TBEA offer EQTR-25191 Rev-06, 14-Aug-2026, BOQ line 1 per unit: GT Rs 18,70,15,000; SMT Rs 12,78,00,000. Ex-works incl. oil, type tests (except dynamic SC) on one unit and supervision; excludes transport, CMS, NIFPS, online drying and spares, which are quoted as separate lines."},B21:{v:"The SAP PR valuation prices are this offer plus transport: GT 18,70,15,000 + 4,50,000 = 19,15,15,000 exactly; SMT 12,78,00,000 + 25,00,000 = 13,03,00,000 against a PR of 13,03,55,000 (Rs 55,000 unexplained). The PR is therefore not an independent estimate. PR 60003136 duplicates PR 60003155/56."},B22:{v:"Offer site is Madhya Pradesh; the technical specification file is titled 2\xD7800 MW Bihar. Ratings match; confirm which project the PR serves. IEEMA PV base date in the offer: 1-Jun-2026 (price variation without ceiling)."},B23:{v:"Oil override (Calculator A): implied from TBEA spare-oil prices at the IEEMA TO base Rs 1,84,800/kL. GT: Rs 22,05,000 for 20% of one unit \u2192 ~59.7 kL. SMT: Rs 8,79,000 for 10% \u2192 ~47.6 kL. If TBEA's oil rate is above the IEEMA base, true volumes are lower: treat these as upper bounds until the GTP arrives."},B24:{v:"Bushing overrides from TBEA spares: GT 420 kV RIP Rs 56.9 L, LV 36 kV 25 kA OIP Rs 21.0 L; SMT 420 kV RIP Rs 57.0 L, LV and LV neutral 52 kV RIP Rs 15.75 L. The SMT LV neutral bushing in the spares list implies a star LV (YNyn), so the SMT LV is set to Star. These are OEM spare selling prices and include OEM margin."},B25:{v:"Out of scope: the 125 MVAr 420 kV shunt reactor in the same offer (Rs 12.50 Cr) has a gapped core and no secondary winding; these models do not cover it."},B26:{v:"Unpriced configurations (Config 3 onwards) default to 'Model average'. With only two calibration points of very different construction, treat that average as provisional."},B28:{v:"KEY ASSUMPTIONS"},B29:{v:"\u2022 Tank volume (oil models): no source data. Rectangular clearance envelope around the active part \xD7 shaping factor (Calculator C). Enter the GTP oil quantity in Section A when the OEM gives it; it then overrides the estimate."},B30:{v:"\u2022 Clearances, insulation ratios and all accessory / test rates in Assumptions & Ref are INDICATIVE. CRGO Rs 95/kg is carried from v9 and is UNVERIFIED; it is the largest single rate uncertainty."},B31:{v:"\u2022 Losses: power defaults from CBIP Annex 1.1 (extrapolated beyond 160 MVA / 220 kV and flagged); distribution from IS 1180 (Pt 1):2014; dry-type has no default table."},B33:{v:"COLOUR CODE"},B34:{v:"Yellow fill + blue text = input. Grey = formula (black) or cross-sheet link (green). Green fill = result."},B36:{v:"SOURCES"},B37:{v:"CBIP / IEEMA Power Transformer Standardisation Manual, Ch. 1, Annex 1.1: ieema.org/wp-content/uploads/2020/07/TManual-Chapter-01.pdf"},B38:{v:"IS 1180 (Part 1):2014, BIS: bis.gov.in/wp-content/uploads/2022/04/Transformers-_compressed.pdf"},B39:{v:"IEEMA PV clauses (power Sep 2021; distribution 2021): ieema.org/wp-content/uploads/2020/07/"},B40:{v:"Reactance formula and design constants: A.K. Sawhney, A Course in Electrical Machine Design (as v9). Copper: MCX 16-Sep-2026 (as v9)."},B41:{v:"Technical specification: Transformer_Technical_Specifications_2x800MW_Bihar.xlsx (impedance ranges, tap ran
